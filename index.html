<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join BR0S DC Server</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:700px;
    max-width:90%;
    background:#1f1f1f;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 35px rgba(162,89,255,.8);
}

h1{
    color:#a259ff;
    font-size:55px;
    text-shadow:0 0 20px #a259ff;
    margin-bottom:15px;
}

.subtitle{
    color:white;
    font-size:24px;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:30px;
    flex-wrap:wrap;
}

.youtube-section{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.support-text{
    color:#ffffff;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.youtube-btn,
.discord-btn{
    text-decoration:none;
    color:white;
    padding:18px 40px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
}

.youtube-btn{
    background:#ff0000;
    box-shadow:0 0 20px #ff0000;
}

.youtube-btn:hover{
    background:#ff3333;
    transform:scale(1.08);
    box-shadow:0 0 35px #ff0000;
}

.discord-btn{
    background:#a259ff;
    box-shadow:0 0 20px #a259ff;
}

.discord-btn:hover{
    background:#bb7cff;
    transform:scale(1.08);
    box-shadow:0 0 35px #a259ff;
}

@media (max-width:600px){
    h1{
        font-size:40px;
    }

    .subtitle{
        font-size:20px;
    }

    .buttons{
        flex-direction:column;
        gap:20px;
    }
}
</style>

</head>
<body>

<div class="container">

    <h1>Join BR0S DC Server</h1>

    <p class="subtitle">Click a button below</p>

    <div class="buttons">

        <div class="youtube-section">
            <p class="support-text">❤️ Support us here ❤️</p>

            <a href="https://www.youtube.com/@HamduVibes007" target="_blank" class="youtube-btn">
                ▶ YouTube
            </a>
        </div>

        <a href="https://discord.gg/DBYWv6rB" target="_blank" class="discord-btn">
            💜 Join Now
        </a>

    </div>

</div>

</body>
</html>
